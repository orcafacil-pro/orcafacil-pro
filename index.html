<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrçaFácil Pro — Gerador Inteligente de Propostas e Margem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; margin: 0 !important; padding: 0 !important; }
      main { display: block !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
      #coluna-preview { width: 100% !important; margin: 0 !important; padding: 0 !important; }
      #area-impressao {
        box-shadow: none !important;
        border: none !important;
        padding: 10mm !important;
        min-height: auto !important;
        width: 100% !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <!-- Barra Superior -->
  <header class="bg-slate-900 text-white py-4 px-6 shadow-md no-print">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-emerald-400">OrçaFácil <span class="text-white">Pro</span></h1>
        <p class="text-xs text-slate-400">Calcule sua margem real e gere propostas em PDF na nuvem</p>
      </div>
      
      <div class="flex flex-wrap items-center gap-3">
        <button onclick="abrirHistorico()" id="btn-historico" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 text-xs px-3 py-2 rounded-lg transition">
          Meus Orçamentos Salvos
        </button>

        <span id="badge-plano" class="text-xs bg-slate-700 text-slate-300 px-3 py-1 rounded-full font-medium">Plano Gratuito</span>
        
        <button onclick="abrirModalPro()" id="btn-upgrade" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold text-xs px-4 py-2 rounded-lg transition shadow">
          Liberar Versão PRO
        </button>

        <div id="area-deslogado">
          <button onclick="abrirModalAuth()" class="bg-white/10 hover:bg-white/20 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
            Entrar / Criar Conta
          </button>
        </div>
        <div id="area-logado" class="hidden flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <span id="user-email-display" class="text-xs text-slate-300 max-w-[140px] truncate"></span>
          <button onclick="fazerLogout()" class="text-[11px] text-amber-400 hover:text-amber-300 font-bold ml-1">Sair</button>
          <span class="text-slate-600">|</span>
          <button onclick="abrirModalExcluirConta()" class="text-[11px] text-red-400 hover:text-red-300 font-medium" title="Excluir minha conta permanentemente">Excluir Conta</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Coluna Esquerda: Painel de Controle -->
    <section class="lg:col-span-5 space-y-6 no-print">
      
      <!-- Dados do Prestador e Cliente -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-slate-700">1. Identificação</h2>
          <span class="text-[11px] text-emerald-600 font-medium">Salvo automaticamente</span>
        </div>

        <!-- Upload de Logo (Exclusivo PRO) -->
        <div class="bg-slate-50 p-3 rounded-lg border border-dashed border-slate-300">
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-semibold text-slate-700">Logotipo da Empresa (Topo do PDF)</label>
            <span id="tag-logo-pro" class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold uppercase">Recurso PRO</span>
          </div>
          <input type="file" id="in-logo" accept="image/*" onchange="carregarLogo(event)" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer">
          <button id="btn-remover-logo" onclick="removerLogo()" class="hidden text-[11px] text-red-500 underline mt-1">Remover logotipo</button>
        </div>

        <div class="grid grid-cols-1 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Sua Empresa / Seu Nome Profissional</label>
            <input type="text" id="in-empresa" oninput="salvarEAtualizar()" placeholder="Ex: Silva Climatização & Elétrica" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Seu WhatsApp / Contato</label>
              <input type="text" id="in-contato" oninput="maskTel(this)" onkeyup="maskTel(this)" placeholder="(00) 00000-0000" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">CNPJ / CPF (Opcional)</label>
              <input type="text" id="in-doc" oninput="maskDoc(this)" onkeyup="maskDoc(this)" placeholder="00.000.000/0000-00" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div class="col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Cliente</label>
              <input type="text" id="in-cliente" oninput="atualizarPreview()" placeholder="Ex: Construtora Horizonte" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nº Orçamento</label>
              <input type="text" id="in-num" value="#001" oninput="atualizarPreview()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-center font-mono">
            </div>
          </div>
        </div>
      </div>

      <!-- Calculadora de Margem Oculta -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-slate-700">2. Precificação Inteligente</h2>
          <span class="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-medium">Invisível no PDF</span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Margem de Lucro (%)</label>
            <input type="number" id="in-margem" value="30" min="0" max="500" oninput="salvarERenderizar()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold text-emerald-700">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Impostos / Taxas (%)</label>
            <input type="number" id="in-imposto" value="6" min="0" max="100" oninput="salvarERenderizar()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
        </div>
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between text-xs">
          <div>
            <span class="text-slate-500 block">Custo Base Total:</span>
            <strong id="res-custo" class="text-slate-700 text-sm">R$ 0,00</strong>
          </div>
          <div class="text-right">
            <span class="text-slate-500 block">Lucro Líquido Estimado:</span>
            <strong id="res-lucro" class="text-emerald-600 text-sm">R$ 0,00</strong>
          </div>
        </div>
      </div>

      <!-- Adicionar Itens -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="font-bold text-slate-700 border-b pb-2">3. Itens e Serviços</h2>
        <div class="space-y-3">
          <input type="text" id="item-desc" placeholder="Descrição do serviço ou material" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Quantidade</label>
              <input type="number" id="item-qtd" value="1" min="1" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Seu Custo Unitário (R$)</label>
              <input type="number" id="item-custo" placeholder="150.00" step="0.01" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            </div>
          </div>
          <button onclick="adicionarItem()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium text-sm py-2.5 rounded-lg transition">
            + Adicionar Item ao Orçamento
          </button>
        </div>

        <div id="lista-controle" class="divide-y divide-slate-100 text-xs max-h-48 overflow-y-auto"></div>
      </div>

      <!-- Condições e Botões de Ação -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="font-bold text-slate-700 border-b pb-2">4. Condições Comerciais</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Validade da Proposta</label>
            <input type="text" id="in-validade" value="7 dias corridos" oninput="salvarEAtualizar()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Forma de Pagamento</label>
            <input type="text" id="in-pagamento" value="50% entrada + 50% entrega" oninput="salvarEAtualizar()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Observações / Garantia</label>
          <textarea id="in-obs" rows="2" oninput="salvarEAtualizar()" placeholder="Ex: Garantia de 90 dias sobre os serviços executados." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button onclick="salvarNaNuvem()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-xl shadow transition text-sm">
            Salvar na Nuvem
          </button>
          <button onclick="gerarPDF()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">
            Gerar PDF
          </button>
        </div>
      </div>

    </section>

    <!-- Coluna Direita: Visualização da Folha A4 -->
    <section id="coluna-preview" class="lg:col-span-7">
      <div class="mb-2 flex justify-between items-center no-print">
